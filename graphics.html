<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphic Design — Aditya Walvekar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#071218;--surface:#0d2029;--ink:#ecfbff;--muted:#9db7c1;--line:rgba(207,245,255,.13);--a:#74e5dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 10%,#145c70,transparent 27%),radial-gradient(circle at 87% 50%,#184668,transparent 25%);opacity:.6}.shell{width:min(1180px,calc(100% - 40px));margin:auto}.nav{height:80px;display:flex;align-items:center;justify-content:space-between}.logo{font:800 23px Syne}.logo b,.accent{color:var(--a)}a{text-decoration:none;color:inherit}.btn,.filter{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 17px;font:700 12px Manrope;cursor:pointer}.hero{padding:60px 0 38px}.eyebrow{font:500 10px "DM Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--a)}h1{font:800 clamp(48px,8vw,100px)/.9 Syne;letter-spacing:-.07em;margin:15px 0}.intro{max-width:560px;color:var(--muted);line-height:1.8;font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 20px}.filter{color:var(--muted);background:transparent;font:500 10px "DM Mono"}.filter.active,.filter:hover{background:var(--ink);color:var(--bg)}.grid{columns:3 260px;column-gap:14px;padding-bottom:80px}.card{position:relative;display:block;width:100%;border:0;border-radius:14px;overflow:hidden;padding:0;margin:0 0 14px;background:var(--surface);cursor:zoom-in;break-inside:avoid}.card img{width:100%;display:block;transition:.5s}.card:after{content:"VIEW DESIGN +";position:absolute;right:11px;bottom:11px;padding:8px 9px;border-radius:999px;background:rgba(2,13,18,.75);color:#fff;border:1px solid rgba(255,255,255,.25);font:500 9px "DM Mono";opacity:0;transform:translateY(8px);transition:.3s}.card:hover img{transform:scale(1.045);filter:saturate(1.1)}.card:hover:after{opacity:1;transform:none}.card[hidden]{display:none}.lightbox{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:25px;background:rgba(2,10,14,.92);backdrop-filter:blur(12px)}.lightbox.open{display:grid}.lightbox img{max-width:min(92vw,880px);max-height:85vh;border-radius:14px;box-shadow:0 30px 100px #000}.lightbox button{position:absolute;top:20px;right:22px;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}@media(max-width:650px){.grid{columns:2 150px;column-gap:10px}.card{margin-bottom:10px}.nav{height:70px}}</style></head><body><header class="shell nav"><a class="logo" href="index.html">AW<b>.</b></a><a class="btn" href="index.html">← Back to portfolio</a></header><main class="shell"><div class="hero"><span class="eyebrow">Graphic design / Suyash Graphics</span><h1>Ideas, made<br><em class="accent">visible.</em></h1><p class="intro">A direct portfolio of social media creatives, product visualisation, promotional posters and flyer design. Select a type to focus the collection, then click any visual for a closer view.</p></div><div class="filters"><button class="filter active" data-filter="all">All designs</button><button class="filter" data-filter="product">Product visualisation</button><button class="filter" data-filter="social">Social media</button><button class="filter" data-filter="poster">Posters & flyers</button></div><div class="grid" id="grid"></div></main><div class="lightbox" id="lightbox"><button aria-label="Close">×</button><img src="" alt="Design preview"></div><script>const designs=[['535a5b72c5e3e097.webp','social','Branding campaign'],['a9a9af856b17f232.webp','social','Digital creative'],['6f058a401e9f2eac.webp','product','Product advertising'],['c6aa1222a64c520e.webp','poster','Promotional poster'],['2aa3d84802ee561b.webp','product','Fashion product visual'],['bc1a13ad7ea41721.webp','social','Campaign creative'],['4c923bf2cc5edafc.webp','poster','Event poster'],['29a42f3a4af6d7e5.webp','social','Social campaign'],['bb05a43fa559a1f6.webp','product','Red Bull product visual'],['ae231736c4d232cf.webp','product','Frooti product visual'],['8878983202f6b5bc.webp','product','boAt product visual'],['f53cdd6152ef3dd1.webp','product','Porsche product visual'],['af7ee467c201bbf5.webp','product','Dove product visual'],['2893c9bcf67573cf.webp','product','Titan product visual'],['51925dea1cdaa013.webp','product','Myntra product visual'],['0e86a0658bfce58f.webp','product','Nescafe product visual'],['41fe16ba5e3c67c5.webp','poster','Promotional flyer']];const grid=document.querySelector('#grid');grid.innerHTML=designs.map(d=>`<button class="card" data-type="${d[1]}" data-title="${d[2]}"><img loading="lazy" src="designs/${d[0]}" alt="${d[2]}"></button>`).join('');const cards=[...document.querySelectorAll('.card')],filters=[...document.querySelectorAll('.filter')],box=document.querySelector('#lightbox'),out=box.querySelector('img');filters.forEach(f=>f.onclick=()=>{filters.forEach(x=>x.classList.remove('active'));f.classList.add('active');cards.forEach(c=>c.hidden=f.dataset.filter!=='all'&&c.dataset.type!==f.dataset.filter)});cards.forEach(c=>c.onclick=()=>{out.src=c.querySelector('img').src;out.alt=c.dataset.title;box.classList.add('open')});box.querySelector('button').onclick=()=>box.classList.remove('open');box.onclick=e=>{if(e.target===box)box.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')box.classList.remove('open')});</script><script>designs.push(['20969b9305d8f02a.webp','social','Social media creative'],['264bb4a353760032.webp','poster','Campaign poster'],['f53b890661aabfd7.webp','product','Product visualisation'],['dadae760a32ce1d9.webp','social','Digital campaign'],['4a975597c571c630.webp','poster','Promotional visual'],['c5f035b53e487ffa.webp','social','Social media design']);grid.innerHTML=designs.map(function(d){return '<button class="card" data-type="'+d[1]+'" data-title="'+d[2]+'"><img loading="lazy" src="designs/'+d[0]+'" alt="'+d[2]+'"></button>'}).join('');var added=[].slice.call(document.querySelectorAll('.card'));added.forEach(function(c){c.onclick=function(){out.src=c.querySelector('img').src;out.alt=c.dataset.title;box.classList.add('open')}});</script><script>(function(){var fs=[].slice.call(document.querySelectorAll('.filter'));var cs=[].slice.call(document.querySelectorAll('.card'));fs.forEach(function(f){f.onclick=function(){fs.forEach(function(x){x.classList.remove('active')});f.classList.add('active');cs.forEach(function(c){c.hidden=f.dataset.filter!=='all'&&c.dataset.type!==f.dataset.filter})}})})();</script></body></html>
