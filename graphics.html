<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Graphic design portfolio by Aditya Walvekar at Suyash Graphics — product visualisations, social media creatives, posters and flyers.">
<meta name="author" content="Aditya Walvekar">
<meta name="theme-color" content="#090909">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aadi-x.github.io/portfolio/graphics.html">
<meta property="og:title" content="Graphic Design Portfolio — Aditya Walvekar">
<meta property="og:description" content="A commercial portfolio of brand visualisations, promotional posters, product renders, and client creatives crafted at Suyash Graphics.">
<meta property="og:image" content="https://aadi-x.github.io/portfolio/og-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Graphic Design Portfolio — Aditya Walvekar">
<meta name="twitter:description" content="A commercial portfolio of brand visualisations, promotional posters, product renders, and client creatives crafted at Suyash Graphics.">
<meta name="twitter:image" content="https://aadi-x.github.io/portfolio/og-card.svg">
<link rel="canonical" href="https://aadi-x.github.io/portfolio/graphics.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23090909%22/><text x=%2250%22 y=%2266%22 font-family=%22Syne,sans-serif%22 font-size=%2252%22 font-weight=%22800%22 fill=%22%23f2f2f2%22 text-anchor=%22middle%22>AW<tspan fill=%22%23d8d8d8%22>.</tspan></text></svg>">
<title>Graphic Design Portfolio — Aditya Walvekar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090909;
  --surface: #141414;
  --card: #181818;
  --ink: #f2f2f2;
  --muted: #a0a0a0;
  --line: rgba(255, 255, 255, 0.13);
  --line-hover: rgba(255, 255, 255, 0.3);
  --a: #d8d8d8;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Manrope, Arial, sans-serif;
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(circle at 12% 10%, #2c2c2c, transparent 27%),
              radial-gradient(circle at 87% 50%, #181818, transparent 25%),
              linear-gradient(125deg, #090909, #141414);
  animation: ambient 14s ease-in-out infinite alternate;
}

@keyframes ambient {
  to {
    transform: scale(1.03);
  }
}

.shell {
  width: min(1180px, calc(100% - 40px));
  margin: auto;
}

.nav {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font: 800 23px Syne;
}

.logo b, .accent {
  color: var(--a);
}

a {
  text-decoration: none;
  color: inherit;
}

.btn, .filter {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 18px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: 700 12px Manrope;
  cursor: pointer;
  transition: 0.25s;
}

.btn:hover {
  transform: translateY(-2px);
  border-color: var(--a);
}

.hero {
  padding: 60px 0 38px;
}

.eyebrow {
  font: 500 10px "DM Mono";
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--a);
}

h1 {
  font: 800 clamp(48px, 8vw, 100px) / 0.9 Syne;
  letter-spacing: -0.07em;
  margin: 15px 0;
}

.intro {
  max-width: 560px;
  color: var(--muted);
  line-height: 1.8;
  font-size: 14px;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 28px 0 20px;
}

.filter {
  color: var(--muted);
  background: transparent;
  font: 500 10px "DM Mono";
}

.filter.active, .filter:hover {
  background: var(--ink);
  color: var(--bg);
}

.grid {
  columns: 3 260px;
  column-gap: 14px;
  padding-bottom: 80px;
}

.card {
  position: relative;
  display: block;
  width: 100%;
  border: 0;
  border-radius: 14px;
  overflow: hidden;
  padding: 0;
  margin: 0 0 14px;
  background: var(--surface);
  cursor: zoom-in;
  break-inside: avoid;
  outline-offset: 2px;
}

.card img {
  width: 100%;
  height: auto;
  display: block;
  transition: 0.5s;
}

.card:after {
  content: "VIEW DESIGN +";
  position: absolute;
  right: 11px;
  bottom: 11px;
  padding: 8px 10px;
  border-radius: 999px;
  background: rgba(14, 14, 14, 0.85);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  font: 500 9px "DM Mono";
  opacity: 0;
  transform: translateY(8px);
  transition: 0.3s;
  pointer-events: none;
}

.card:hover img, .card:focus-visible img {
  transform: scale(1.045);
  filter: saturate(1.1);
}

.card:hover:after, .card:focus-visible:after {
  opacity: 1;
  transform: none;
}

.card[hidden] {
  display: none;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  place-items: center;
  padding: 25px;
  background: rgba(2, 10, 14, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.lightbox.open {
  display: grid;
}

.lightbox img {
  max-width: min(92vw, 880px);
  max-height: 85vh;
  border-radius: 14px;
  box-shadow: 0 30px 100px rgba(0, 0, 0, 0.85);
  object-fit: contain;
}

.lightbox button {
  position: absolute;
  top: 20px;
  right: 22px;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  font-size: 22px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: 0.2s;
}

.lightbox button:hover {
  background: var(--ink);
  color: var(--bg);
}

@media (max-width: 650px) {
  .shell {
    width: 100%;
    padding: 0 16px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(34px, 11vw, 56px);
    overflow-wrap: break-word;
  }
  .grid {
    columns: 2 140px;
    column-gap: 10px;
  }
  .card {
    margin-bottom: 10px;
  }
  .nav {
    height: 70px;
  }
}

@media (max-width: 380px) {
  .grid {
    columns: 1 100%;
  }
  h1 {
    font-size: clamp(28px, 9.8vw, 36px);
  }
}

/* Scroll Progress Bar */
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #d8d8d8, #ffffff);
  z-index: 9999;
  transition: width 0.08s ease-out;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
}

/* Fluid Custom Cursor */
html.has-custom-cursor,
html.has-custom-cursor *,
body.has-custom-cursor,
body.has-custom-cursor * {
  cursor: none !important;
}

.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 6px;
  height: 6px;
  background: #ffffff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: opacity 0.2s, transform 0.08s ease-out;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
}

.cursor-ring {
  position: fixed;
  top: 0;
  left: 0;
  width: 32px;
  height: 32px;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%);
  transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
              height 0.22s cubic-bezier(0.16, 1, 0.3, 1),
              background 0.22s,
              border-color 0.22s,
              opacity 0.2s;
  mix-blend-mode: difference;
}

.cursor-ring.is-hovering {
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.9);
  backdrop-filter: invert(1);
}

.cursor-ring.is-clicking {
  transform: translate(-50%, -50%) scale(0.85);
}

.cursor-hidden {
  opacity: 0 !important;
}

@media (pointer: coarse) {
  .cursor-dot, .cursor-ring {
    display: none !important;
  }
}
</style>
</head>
<body>
<div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
<header class="shell nav">
  <a class="logo" href="index.html">AW<b>.</b></a>
  <a class="btn" href="index.html">← Back to portfolio</a>
</header>
<main class="shell">
  <div class="hero">
    <span class="eyebrow">Graphic design / Suyash Graphics</span>
    <h1>Ideas, made<br><em class="accent">visible.</em></h1>
    <p class="intro">A direct portfolio of social media creatives, product visualisation, promotional posters and flyer design. Select a type to focus the collection, then click any visual for a closer view.</p>
  </div>
  <div class="filters" role="group" aria-label="Filter designs by category">
    <button class="filter active" data-filter="all" aria-pressed="true">All designs</button>
    <button class="filter" data-filter="product" aria-pressed="false">Product visualisation</button>
    <button class="filter" data-filter="social" aria-pressed="false">Social media</button>
    <button class="filter" data-filter="poster" aria-pressed="false">Posters & flyers</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Design preview lightbox">
  <button aria-label="Close preview">×</button>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Design preview">
</div>

<script>
const designs = [
  ['535a5b72c5e3e097.webp', 'social', 'Branding campaign'],
  ['a9a9af856b17f232.webp', 'social', 'Digital creative'],
  ['6f058a401e9f2eac.webp', 'product', 'Product advertising'],
  ['c6aa1222a64c520e.webp', 'poster', 'Promotional poster'],
  ['2aa3d84802ee561b.webp', 'product', 'Fashion product visual'],
  ['bc1a13ad7ea41721.webp', 'social', 'Campaign creative'],
  ['4c923bf2cc5edafc.webp', 'poster', 'Event poster'],
  ['29a42f3a4af6d7e5.webp', 'social', 'Social campaign'],
  ['bb05a43fa559a1f6.webp', 'product', 'Red Bull product visual'],
  ['ae231736c4d232cf.webp', 'product', 'Frooti product visual'],
  ['8878983202f6b5bc.webp', 'product', 'boAt product visual'],
  ['f53cdd6152ef3dd1.webp', 'product', 'Porsche product visual'],
  ['af7ee467c201bbf5.webp', 'product', 'Dove product visual'],
  ['2893c9bcf67573cf.webp', 'product', 'Titan product visual'],
  ['51925dea1cdaa013.webp', 'product', 'Myntra product visual'],
  ['0e86a0658bfce58f.webp', 'product', 'Nescafe product visual'],
  ['41fe16ba5e3c67c5.webp', 'poster', 'Promotional flyer'],
  ['20969b9305d8f02a.webp', 'social', 'Social media creative'],
  ['264bb4a353760032.webp', 'poster', 'Campaign poster'],
  ['f53b890661aabfd7.webp', 'product', 'Product visualisation'],
  ['dadae760a32ce1d9.webp', 'social', 'Digital campaign'],
  ['4a975597c571c630.webp', 'poster', 'Promotional visual'],
  ['c5f035b53e487ffa.webp', 'social', 'Social media design']
];

const grid = document.querySelector('#grid');
grid.innerHTML = designs.map(d =>
  `<button class="card" data-type="${d[1]}" data-title="${d[2]}" aria-label="View ${d[2]}">` +
  `<img loading="lazy" src="designs/${d[0]}" alt="${d[2]}">` +
  `</button>`
).join('');

const cards = [...document.querySelectorAll('.card')];
const filters = [...document.querySelectorAll('.filter')];
const box = document.querySelector('#lightbox');
const out = box.querySelector('img');
const closeBtn = box.querySelector('button');
let lastFocusedCard = null;

filters.forEach(f => f.addEventListener('click', () => {
  filters.forEach(x => {
    x.classList.remove('active');
    x.setAttribute('aria-pressed', 'false');
  });
  f.classList.add('active');
  f.setAttribute('aria-pressed', 'true');
  const target = f.dataset.filter;
  cards.forEach(c => {
    c.hidden = target !== 'all' && c.dataset.type !== target;
  });
}));

function openLightbox(card) {
  lastFocusedCard = card;
  const img = card.querySelector('img');
  out.src = img.src;
  out.alt = card.dataset.title;
  box.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeLightbox() {
  box.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocusedCard) {
    lastFocusedCard.focus();
    lastFocusedCard = null;
  }
}

cards.forEach(c => c.addEventListener('click', () => openLightbox(c)));
closeBtn.addEventListener('click', closeLightbox);
box.addEventListener('click', e => {
  if (e.target === box) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && box.classList.contains('open')) {
    closeLightbox();
  }
});

// Scroll Progress Bar
const scrollProgressBar = document.querySelector('#scroll-progress');
if (scrollProgressBar) {
  window.addEventListener('scroll', () => {
    const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
    const progress = totalScroll > 0 ? (window.scrollY / totalScroll) * 100 : 0;
    scrollProgressBar.style.width = `${progress}%`;
  }, { passive: true });
}

// Fluid Custom Cursor
(function() {
  let initialized = false;

  function initCursor() {
    if (initialized) return;
    initialized = true;

    const dot = document.createElement('div');
    dot.className = 'cursor-dot cursor-hidden';
    const ring = document.createElement('div');
    ring.className = 'cursor-ring cursor-hidden';
    document.body.appendChild(dot);
    document.body.appendChild(ring);
    document.documentElement.classList.add('has-custom-cursor');
    document.body.classList.add('has-custom-cursor');

    let mouseX = -100, mouseY = -100;
    let ringX = -100, ringY = -100;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.left = `${mouseX}px`;
      dot.style.top = `${mouseY}px`;
      dot.classList.remove('cursor-hidden');
      ring.classList.remove('cursor-hidden');
    });

    window.addEventListener('mouseenter', () => {
      dot.classList.remove('cursor-hidden');
      ring.classList.remove('cursor-hidden');
    });

    function renderCursorRing() {
      ringX += (mouseX - ringX) * 0.18;
      ringY += (mouseY - ringY) * 0.18;
      ring.style.left = `${ringX}px`;
      ring.style.top = `${ringY}px`;
      requestAnimationFrame(renderCursorRing);
    }
    requestAnimationFrame(renderCursorRing);

    document.addEventListener('mouseleave', () => {
      dot.classList.add('cursor-hidden');
      ring.classList.add('cursor-hidden');
    });

    document.addEventListener('mousedown', () => ring.classList.add('is-clicking'));
    document.addEventListener('mouseup', () => ring.classList.remove('is-clicking'));

    const hoverSelectors = 'a, button, .card, .btn, .filter, .lightbox button';
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest(hoverSelectors)) {
        ring.classList.add('is-hovering');
      }
    });

    document.addEventListener('mouseout', (e) => {
      if (e.target.closest(hoverSelectors)) {
        ring.classList.remove('is-hovering');
      }
    });
  }

  if (window.matchMedia('(pointer: fine)').matches) {
    initCursor();
  } else {
    window.addEventListener('mousemove', function onFirstMove(e) {
      if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
      initCursor();
      window.removeEventListener('mousemove', onFirstMove);
    }, { once: true });
  }

  window.addEventListener('touchstart', () => {
    document.documentElement.classList.remove('has-custom-cursor');
    document.body.classList.remove('has-custom-cursor');
    const dot = document.querySelector('.cursor-dot');
    const ring = document.querySelector('.cursor-ring');
    if (dot) dot.classList.add('cursor-hidden');
    if (ring) ring.classList.add('cursor-hidden');
  }, { passive: true });
})();

// Interactive Spotlight Tracker on Cards
cards.forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    card.style.setProperty('--mouse-x', `${x}px`);
    card.style.setProperty('--mouse-y', `${y}px`);
  });
});
</script>
</body>
</html>
