<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#181c22"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </radialGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86BC25" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#86BC25" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="24" fill="url(#bg)" />
  <rect x="16" y="16" width="868" height="588" rx="16" fill="none" stroke="url(#border)" stroke-width="1.5" />
  <rect x="26" y="26" width="848" height="568" rx="10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Accent glow in corner -->
  <circle cx="840" cy="60" r="80" fill="#86BC25" opacity="0.12" filter="url(#glow)" />
  <circle cx="60" cy="560" r="80" fill="#86BC25" opacity="0.08" filter="url(#glow)" />

  <!-- Top Badge -->
  <rect x="300" y="58" width="300" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="#86BC25" stroke-width="1" stroke-opacity="0.4" />
  <text x="450" y="79" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#86BC25" text-anchor="middle" letter-spacing="2">DELOITTE INSIGHTS</text>

  <!-- Title -->
  <text x="450" y="145" font-family="'Syne', sans-serif" font-size="14" font-weight="500" fill="#8e9ba4" text-anchor="middle" letter-spacing="4">THIS IS PROUDLY PRESENTED TO</text>
  <text x="450" y="205" font-family="'Syne', sans-serif" font-size="42" font-weight="800" fill="#f5f7fa" text-anchor="middle" letter-spacing="-1">ADITYA WALVEKAR</text>
  
  <line x1="280" y1="228" x2="620" y2="228" stroke="#86BC25" stroke-width="2" opacity="0.7" />

  <text x="450" y="265" font-family="'Manrope', sans-serif" font-size="14" font-weight="500" fill="#9ba8ab" text-anchor="middle">In recognition of successful participation &amp; fulfillment of credential requirements in</text>
  <text x="450" y="310" font-family="'Syne', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Data Analytics Simulation</text>
  
  <text x="450" y="350" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#86BC25" text-anchor="middle">Issued by Deloitte</text>
  
  <text x="450" y="395" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#7a8894" text-anchor="middle">Practical Data Analytics, Business Intelligence & Data Driven Decision Making</text>

  <!-- Security Seal / Verified Mark -->
  <g transform="translate(410, 435)">
    <circle cx="40" cy="40" r="34" fill="rgba(255,255,255,0.03)" stroke="#86BC25" stroke-width="1.5" />
    <circle cx="40" cy="40" r="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3" />
    <path d="M30 40 L37 47 L51 33" fill="none" stroke="#86BC25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="90" font-family="'DM Mono', monospace" font-size="9" font-weight="600" fill="#8e9ba4" text-anchor="middle" letter-spacing="1.5">VERIFIED RECORD</text>
  </g>

  <!-- Bottom Details -->
  <text x="70" y="555" font-family="'DM Mono', monospace" font-size="10" fill="#616f7c">PROGRAM: 2026</text>
  <text x="70" y="572" font-family="'DM Mono', monospace" font-size="9" fill="#424d57">ID: AW-CRED-2026-VAL</text>

  <text x="830" y="555" font-family="'DM Mono', monospace" font-size="10" fill="#616f7c" text-anchor="end">RECIPIENT: ADITYA WALVEKAR</text>
  <text x="830" y="572" font-family="'DM Mono', monospace" font-size="9" fill="#424d57" text-anchor="end">PORTFOLIO CREDENTIAL REPO</text>
</svg>