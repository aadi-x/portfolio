<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-glow" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#accent-glow)"/>

  <!-- Subtle Grid Lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="1120" y1="80" x2="1120" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Brand Badge -->
  <g transform="translate(130, 140)">
    <rect width="320" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="20" cy="18" r="5" fill="#22c55e"/>
    <text x="35" y="23" font-family="'DM Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#d8d8d8" letter-spacing="1.5">AI/ML STUDENT · DEVELOPER · DESIGNER</text>
  </g>

  <!-- Name -->
  <text x="130" y="260" font-family="'Syne', Arial, sans-serif" font-size="78" font-weight="800" fill="#f2f2f2" letter-spacing="-2">ADITYA WALVEKAR</text>
  
  <!-- Subtitle / Tagline -->
  <text x="130" y="325" font-family="'Syne', Arial, sans-serif" font-size="32" font-weight="700" fill="#a0a0a0" letter-spacing="-0.5">Designer × Developer × Creator</text>

  <!-- Description -->
  <text x="130" y="390" font-family="'Manrope', Arial, sans-serif" font-size="20" font-weight="400" fill="#888888">B.Tech AIML Undergrad building practical machine learning pipelines,</text>
  <text x="130" y="420" font-family="'Manrope', Arial, sans-serif" font-size="20" font-weight="400" fill="#888888">interactive web applications, and precision visual systems.</text>

  <!-- Tags / Pillars -->
  <g transform="translate(130, 475)">
    <rect x="0" y="0" width="130" height="34" rx="6" fill="#181818" stroke="rgba(255,255,255,0.14)"/>
    <text x="16" y="22" font-family="'DM Mono', monospace" font-size="12" fill="#d8d8d8">Python &amp; ML</text>

    <rect x="145" y="0" width="135" height="34" rx="6" fill="#181818" stroke="rgba(255,255,255,0.14)"/>
    <text x="161" y="22" font-family="'DM Mono', monospace" font-size="12" fill="#d8d8d8">Data Science</text>

    <rect x="295" y="0" width="130" height="34" rx="6" fill="#181818" stroke="rgba(255,255,255,0.14)"/>
    <text x="311" y="22" font-family="'DM Mono', monospace" font-size="12" fill="#d8d8d8">Web Apps</text>

    <rect x="440" y="0" width="150" height="34" rx="6" fill="#181818" stroke="rgba(255,255,255,0.14)"/>
    <text x="456" y="22" font-family="'DM Mono', monospace" font-size="12" fill="#d8d8d8">Graphic Design</text>
  </g>

  <!-- Bottom URL -->
  <text x="1070" y="498" font-family="'DM Mono', monospace" font-size="14" font-weight="600" fill="#666666" text-anchor="end">aadi-x.github.io/portfolio</text>
</svg>
